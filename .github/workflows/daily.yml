name: BUDI World Daily Simulation

on:
  schedule:
    # Paleidžiama kasdien 00:00 UTC (arba pasirinktu laiku)
    - cron: '0 0 * * *'
  workflow_dispatch: # Leidžia paleisti ir rankiniu būdu iš GitHub UI

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install || npm install

      - name: Run Budi Simulation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generate.js

      - name: Commit and Push updated state & logs
        run: |
          git config --global user.name "budi-bot"
          git config --global user.email "bot@budi.world"
          git add data/ output/
          git commit -m "chore(simulation): auto-generated cycle episode [skip ci]" || exit 0
          git push
