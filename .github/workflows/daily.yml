name: BUDI World Daily Simulation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Įdiegiame pnpm pasitelkdami oficialų pnpm action
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 2. Įdiegiame Node.js (be automatinio pnpm store kodo tikrinimo, kad išvengtume workspace klaidos)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Įdiegiame priklausomybes
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 4. Paleidžiame Budi simuliaciją
      - name: Run Budi Simulation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generate.js

      # 5. Įrašome ir išsaugojame pakeitimus GitHub'e
      - name: Commit and Push updated state & logs
        run: |
          git config --global user.name "budi-bot"
          git config --global user.email "bot@budi.world"
          git add data/ output/
          git commit -m "chore(simulation): auto-generated cycle episode [skip ci]" || exit 0
          git push
