name: BUDI World Daily Simulation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Budi Simulation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generate.js

      - name: Commit and Push updated state & logs
        run: |
          git config user.name "budi-bot"
          git config user.email "bot@budi.world"
          git add data/ output/
          git commit -m "chore(simulation): auto-generated cycle episode [skip ci]" || exit 0
          git push
