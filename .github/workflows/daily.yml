name: BUDI World Daily Simulation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Budi Simulation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generate.js

      - name: Commit and push generated content
        run: |
        git config --global user.name "budi-bot"
        git config --global user.email "bot@budi.world"
    
        # Pridedame visus pakeitimus, įskaitant naujus ar pašalintus failus
        git add -A
    
        # Užfiksuojame pakeitimus, jei tokių yra
        git diff --staged --quiet || git commit -m "chore(simulation): auto-generate cycle logs and docs [skip ci]"
    
        # Rebase su autostash – apsaugo nuo "unstaged changes" klaidos
        git pull origin main --rebase --autostash || true
    
        # Bandome push'inti kelis kartus (jei GitHub išmeta Internal Server Error)
        for i in {1..3}; do
        git push origin main && break || sleep 5
        done
