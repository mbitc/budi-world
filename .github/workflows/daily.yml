name: BUDI World Daily Simulation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Budi Simulation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generate.js

      - name: Commit and Push Logs & State
        run: |
          git config --global user.name "budi-bot"
          git config --global user.email "bot@budi.world"
          
          # Pridedame duomenų logus, archyvą ir GitHub Pages /docs katalogą
          git add data/ output/ docs/
          
          # Jei nėra naujų pakeitimų, skriptas nesulūžta, o ramiai baigia darbą
          git commit -m "chore(simulation): auto-generate cycle logs and docs [skip ci]" || exit 0
          
          git pull origin main --rebase || true
    
          git push origin main 
